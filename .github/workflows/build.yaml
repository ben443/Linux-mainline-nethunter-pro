name: Build Mainline Kernel (sm8250)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build sm8250 Kernel
    runs-on: ubuntu-latest
    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev \
            libelf-dev gcc-aarch64-linux-gnu cpio kmod

      - name: Configure Kernel
        run: |
          make defconfig
          ./scripts/kconfig/merge_config.sh -m .config arch/arm64/configs/sm8250.config
          make olddefconfig

      - name: Compile Kernel, DTBs, and Modules
        run: |
          make -j$(nproc) Image.gz dtbs modules

      - name: Install Modules and Generate Initrd
        run: |
          mkdir -p initramfs_staging
          
          make modules_install INSTALL_MOD_PATH=./initramfs_staging
          
          rm -f initramfs_staging/lib/modules/*/build
          rm -f initramfs_staging/lib/modules/*/source
          
          cd initramfs_staging
          find . | cpio -H newc -o | gzip -9 > ../initrd.img

      - name: Upload Kernel Image (Image.gz)
        uses: actions/upload-artifact@v4
        with:
          name: sm8250-Image.gz
          path: arch/arm64/boot/Image.gz

      - name: Upload Device Tree Blobs (DTBs)
        uses: actions/upload-artifact@v4
        with:
          name: sm8250-dtbs
          path: arch/arm64/boot/dts/qcom/sm8250*.dtb

      - name: Upload Initrd (initrd.img)
        uses: actions/upload-artifact@v4
        with:
          name: sm8250-initrd
          path: initrd.img
