name: Build Mainline Kernel and modules (sm8250)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build sm8250 Kernel
    runs-on: ubuntu-latest
    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev \
            libelf-dev gcc-aarch64-linux-gnu cpio kmod

      - name: Configure Kernel
        run: |
          make defconfig
          ./scripts/kconfig/merge_config.sh -m .config arch/arm64/configs/sm8250.config
          make olddefconfig

      - name: Compile Kernel, DTBs, and Modules
        run: |
          make -j$(nproc) Image.gz dtbs modules

      - name: Build initramfs with kernel modules
        run: |
          set -euo pipefail

          staging_dir="$PWD/initramfs_staging"
          kernel_release="$(make -s kernelrelease)"
          rm -rf "$staging_dir"
          mkdir -p "$staging_dir"

          make modules_install INSTALL_MOD_PATH="$staging_dir"

          # Remove build-tree links; keep the installed modules and depmod metadata.
          rm -f "$staging_dir/lib/modules/$kernel_release/build" \
                "$staging_dir/lib/modules/$kernel_release/source"

          test -n "$(find "$staging_dir/lib/modules/$kernel_release" -type f -name '*.ko*' -print -quit)"

          # Pack the staged /lib/modules tree into a compressed newc initramfs.
          (cd "$staging_dir" && find . -print0 | cpio --null --quiet -o -H newc) | gzip -9 > initramfs.img

      - name: Upload Kernel Image (Image.gz)
        uses: actions/upload-artifact@v4
        with:
          name: sm8250-Image.gz
          path: arch/arm64/boot/Image.gz

      - name: Upload Device Tree Blobs (DTBs)
        uses: actions/upload-artifact@v4
        with:
          name: sm8250-dtbs
          path: arch/arm64/boot/dts/qcom/sm8250*.dtb

      - name: Upload Initramfs (initramfs.img)
        uses: actions/upload-artifact@v4
        with:
          name: sm8250-initramfs
          path: initramfs.img
